<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
</head>
<body>
    <header>
        <h1>Inscription au Club Informatique</h1>
    </header>
    <form action="merci.html" method="get">
        <main>
            <h2>Vos informations</h2>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required minlength="2"><br><br>
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="nom" required minlength="2"><br><br>
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" required pattern="[0-9]{8}" title="8 chiffres sans espaces"><br><br>
            <label for="mdp">Mot de passe</label>
            <input type="password" id="mdp" name="mdp" required minlength="8"><br><br>
            <label for="naissance">Date de naissance</label>
            <input type="date" id="naissance" name="naissance" required min="1990-01-01" max="2010-12-31"><br><br>
            <section>
                <fieldset>
                    <legend>Niveau en informatique</legend>
                    <input type="radio" id="niveau" name="niveau" value="debutant">
                    <label for="niveau">Débutant</label><br><br>
                    <input type="radio" id="Intermediare" name="niveau" value="Intermediare">
                    <label for="Intermediare">Intermediare</label><br><br>
                    <input type="radio" id="Avance" name="niveau" value="Avance">
                    <label for="Avance">Débutant</label><br><br>
                </fieldset>
            </section>
            <section>
                <fieldset>
                    <legend>Ateliers souhaités</legend>
                    <input type="checkbox" id="python" name="atelier" value="python">
                    <label for="python">Atelier Python</label><br><br>
                    <input type="checkbox" id="jeux" name="atelier" value="jeux-video">
                    <label for="jeux">Atelier jeux video</label><br><br>
                </fieldset>
            </section>
            <label>Année d'études</label>
            <select name="annee" required>
                <option value="" selected>Choisir</option>
                <option value="">1ere</option>
                <option value="">2eme</option>
                <option value="">3eme</option>
            </select><br><br>
            <label>Motivation</label>
            <textarea rows="4" cols="40" name="motivation"></textarea><br><br>
            <input type="checkbox" name="reglement" required>
            <label for="reglement">J'accepte le règlement du club</label><br><br>
            <button type="submit" value="Envoyer">Envoyer</button>
            <button type="reset" value="Reinitialiser">Réinitialiser</button>
        </main>
    </form>
    <footer>
        <p>@Club Informatique</p>
        <p><a href="index.html">Retour à l'accueil</a></p>
    </footer>
</body>
</html>
